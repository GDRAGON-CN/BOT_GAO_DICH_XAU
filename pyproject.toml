[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-trading-bot"
version = "1.0.0"
description = "Personal automated gold trading system integrating TradingView, MT5, FastAPI, and MySQL."
authors = [{ name = "Trader" }]
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "backend/alembic",
    "frontend"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
